# Server block for the built PWA (replaces nginx's default.conf).
#
# Notes:
# - Vite emits hashed filenames under /assets/ (incl. the xmllint.wasm for the
#   XSD tool). nginx >= 1.23 already maps `.wasm` -> application/wasm in its
#   stock mime.types, so streaming compilation works.
# - The service worker (sw.js) and precache manifest must never be cached by
#   the browser/proxy, or `autoUpdate` can't pick up new deploys.
# - The app routes via hash (e.g. #/json), so only "/" is ever requested — the
#   SPA fallback below just keeps deep refreshes safe.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Immutable hashed assets — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA shell + metadata: always revalidate so the SW can auto-update.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
    }

    # Public files shipped as-is (icons, theme-init.js, COPYING).
    location ~* \.(svg|webmanifest|txt)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
